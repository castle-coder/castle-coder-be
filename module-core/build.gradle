dependencies {
    // ==========================================
    // Spring Boot 기본 의존성
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-web'        // Spring MVC
    implementation 'org.springframework.boot:spring-boot-starter-webflux'    // Reactive Web
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'   // JPA
    implementation 'org.springframework.boot:spring-boot-starter-security'   // Spring Security

    // ==========================================
    // 데이터베이스 관련 의존성
    // ==========================================
    runtimeOnly 'org.postgresql:postgresql'                                 // PostgreSQL 드라이버

    // ==========================================
    // API 문서화 의존성
    // ==========================================
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'  // Swagger UI

    // ==========================================
    // 프로젝트 내부 모듈 의존성
    // ==========================================
    implementation project(":module-common")  // 공통 모듈

    // ==========================================
    // 테스트 관련 의존성
    // ==========================================
    testImplementation 'io.projectreactor:reactor-test'                     // Reactive 테스트
    testImplementation 'org.springframework.security:spring-security-test'  // Security 테스트
}