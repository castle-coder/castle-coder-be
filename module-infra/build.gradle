plugins {
    id("com.google.protobuf") version "0.9.3"
}

def grpcVersion = "1.66.0"
def protobufVersion = '3.25.3'
def protocVersion = protobufVersion

dependencies {
    // ==========================================
    // Spring Boot 기본 의존성
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-web'        // Spring MVC
    implementation 'org.springframework.boot:spring-boot-starter-webflux'    // Reactive Web
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'   // JPA
    implementation 'org.springframework.boot:spring-boot-starter-security'   // Spring Security

    // ==========================================
    // gRPC 관련 의존성
    // ==========================================
    // 프로토콜 버퍼
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"   // Protocol Buffers

    // gRPC 서버/클라이언트
    implementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'  // gRPC 클라이언트
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'         // gRPC 서버
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"               // gRPC Netty
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"                   // gRPC Protocol Buffers
    implementation "io.grpc:grpc-stub:${grpcVersion}"                       // gRPC Stub
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'                  // Tomcat Annotations

    // ==========================================
    // AWS S3 관련 의존성
    // ==========================================
    implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'  // AWS S3

    // ==========================================
    // 프로젝트 내부 모듈 의존성
    // ==========================================
    implementation project(":module-common")  // 공통 모듈
    implementation project(":module-core")    // 코어 모듈

    // ==========================================
    // 테스트 관련 의존성
    // ==========================================
    testImplementation 'io.projectreactor:reactor-test'                     // Reactive 테스트
    testImplementation 'org.springframework.security:spring-security-test'  // Security 테스트

    // ==========================================
    // redis 관련 의존성
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}

// 프로토콜 버퍼 컴파일러(protoc) 설정
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }

    // gRPC 플러그인 설정
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.66.0'
        }
    }

    // 프로토콜 버퍼 생성 작업 설정
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
        ofSourceSet('main')
    }
}

// 'clean' 작업 설정
tasks.named('clean') {
    doFirst {
        delete 'build/generated/source/proto' // 프로토콜 버퍼 생성된 디렉토리 삭제
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}