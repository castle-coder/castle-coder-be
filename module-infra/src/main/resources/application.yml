# AWS S3
cloud:
  aws:
    s3:
      bucket: castle-coder-s3-bucket   # 버킷 이름
    region:
      static: ap-northeast-2  # 버킷의 리전
    stack:
      auto: false
    credentials:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}

spring:
  servlet:
    multipart:
      max-file-size: 10MB # multipart/form-data 요청의 최대 허용 크기. 기본 1MB
      max-request-size: 10MB # multipart/form-data 요청의 최대 허용 크기. 기본 10MB
