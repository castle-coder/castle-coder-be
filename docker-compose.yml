version: "3.8"

services:
  # --- 데이터베이스 ---
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks: [castle-coder-net]

  # Redis → Prometheus 메트릭
  redis-exporter:
    image: bitnami/redis-exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    networks: [castle-coder-net]

  # --- 애플리케이션 ---
  app:
    image: ${DOCKER_USERNAME}/castle-coder-be:latest  # export DOCKER_USERNAME=...
    container_name: castle-coder-be
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    working_dir: /app
    networks: [castle-coder-net]

  # --- 모니터링 ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [castle-coder-net]

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks: [castle-coder-net]

networks:
  castle-coder-net:
    driver: bridge
