name: Castle Coder BE CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR
        run: ./gradlew :module-api:clean :module-api:bootjar

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/castle-coder-be:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 1) Compose·Prometheus 파일만 전송 (.env 제외)
      - name: Upload stack files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: |
            docker-compose.yml
            prometheus/prometheus.yml
          target: ~/castle-coder-be

      # 2) 원격 배포
      - name: SSH Deploy via Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/castle-coder-be

            # .env 미리 준비
            touch .env

            # .env 값 갱신 함수
            update_env () {
              VAR=$1 VAL=$2
              grep -q "^${VAR}=" .env && sed -i "s|^${VAR}=.*|${VAR}=${VAL}|" .env \
                || echo "${VAR}=${VAL}" >> .env
            }

            # secrets 주입
            update_env RUNPOD_API_KEY "${{ secrets.RUNPOD_API_KEY }}"
            update_env RUNPOD_BASE_URL "${{ secrets.RUNPOD_BASE_URL }}"
            update_env RUNPOD_ENDPOINT "${{ secrets.RUNPOD_ENDPOINT }}"
            update_env DB_USERNAME "${{ secrets.DB_USERNAME }}"
            update_env DB_URL "${{ secrets.DB_URL }}"
            update_env DB_PASSWORD "${{ secrets.DB_PASSWORD }}"
            update_env ACCESS_EXPIRATION_SECONDS "${{ secrets.ACCESS_EXPIRATION_SECONDS }}"
            update_env JWT_SECRET_KEY "${{ secrets.JWT_SECRET_KEY }}"
            update_env REFRESH_EXPIRATION_SECONDS "${{ secrets.REFRESH_EXPIRATION_SECONDS }}"
            update_env AWS_S3_ACCESS_KEY "${{ secrets.AWS_S3_ACCESS_KEY }}"
            update_env AWS_S3_SECRET_KEY "${{ secrets.AWS_S3_SECRET_KEY }}"
            update_env OPENAI_API_KEY "${{ secrets.OPENAI_API_KEY }}"
            update_env DOCKER_USERNAME "${{ secrets.DOCKER_USERNAME }}"

            # Docker Compose CLI 설치(최초 1회만)
            if ! command -v docker compose >/dev/null 2>&1; then
              sudo curl -sSL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 \
                   -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # 최신 이미지 받아서 서비스 재시작
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker-compose ps
