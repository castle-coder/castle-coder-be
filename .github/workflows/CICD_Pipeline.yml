name: Castle Coder BE CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build :module-api:clean :module-api:bootjar

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/castle-coder-be:latest
          push: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            if grep -q "^RUNPOD_API_KEY=" .env; then
              sed -i "s/^RUNPOD_API_KEY=.*/RUNPOD_API_KEY=${{ secrets.RUNPOD_API_KEY }}/" .env
            else
              echo "RUNPOD_API_KEY=${{ secrets.RUNPOD_API_KEY }}" >> .env
            fi

            if grep -q "^RUNPOD_BASE_URL=" .env; then
              sed -i "s/^RUNPOD_BASE_URL=.*/RUNPOD_BASE_URL=${{ secrets.RUNPOD_BASE_URL }}/" .env
            else
              echo "RUNPOD_BASE_URL=${{ secrets.RUNPOD_BASE_URL }}" >> .env
            fi

            if grep -q "^RUNPOD_ENDPOINT=" .env; then
              sed -i "s/^RUNPOD_ENDPOINT=.*/RUNPOD_ENDPOINT=${{ secrets.RUNPOD_ENDPOINT }}/" .env
            else
              echo "RUNPOD_ENDPOINT=${{ secrets.RUNPOD_ENDPOINT }}" >> .env
            fi
            
            if grep -q "^DB_USERNAME=" .env; then
              sed -i "s/^DB_USERNAME=.*/DB_USERNAME=${{ secrets.DB_USERNAME }}/" .env
            else
              echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            fi
            
            if grep -q "^DB_URL=" .env; then
              sed -i "s/^DB_URL=.*/DB_URL=${{ secrets.DB_URL }}/" .env
            else
              echo "DB_URL=${{ secrets.DB_URL }}" >> .env
            fi
            
            if grep -q "^DB_PASSWORD=" .env; then
              sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/" .env
            else
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            fi
            
            if grep -q "^ACCESS_EXPIRATION_SECONDS=" .env; then
              sed -i "s/^ACCESS_EXPIRATION_SECONDS=.*/ACCESS_EXPIRATION_SECONDS=${{ secrets.ACCESS_EXPIRATION_SECONDS }}/" .env
            else
              echo "ACCESS_EXPIRATION_SECONDS=${{ secrets.ACCESS_EXPIRATION_SECONDS }}" >> .env
            fi
            
            if grep -q "^JWT_SECRET_KEY=" .env; then
              sed -i "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}/" .env
            else
              echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
            fi
            
            if grep -q "^REFRESH_EXPIRATION_SECONDS=" .env; then
              sed -i "s/^REFRESH_EXPIRATION_SECONDS=.*/REFRESH_EXPIRATION_SECONDS=${{ secrets.REFRESH_EXPIRATION_SECONDS }}/" .env
            else
              echo "REFRESH_EXPIRATION_SECONDS=${{ secrets.REFRESH_EXPIRATION_SECONDS }}" >> .env
            fi
            
            if grep -q "^AWS_S3_ACCESS_KEY=" .env; then
              sed -i "s/^AWS_S3_ACCESS_KEY=.*/AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}/" .env
            else
              echo "AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}" >> .env
            fi
            
            if grep -q "^AWS_S3_SECRET_KEY=" .env; then
              sed -i "s/^AWS_S3_SECRET_KEY=.*/AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}/" .env
            else
              echo "AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}" >> .env
            fi
            
            if grep -q "^OPENAI_API_KEY=" .env; then
              sed -i "s/^OPENAI_API_KEY=.*/OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}/" .env
            else
              echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
            fi
            
            docker stop redis || true
            docker rm redis || true
            docker stop castle-coder-be || true
            docker rm castle-coder-be || true
            
            NETWORK=castle-coder-network

            # 네트워크가 없으면 생성
            if ! docker network inspect $NETWORK >/dev/null 2>&1; then
              docker network create $NETWORK
            fi
            
            # Redis 컨테이너 실행
            docker run -d \
              --name redis \
              --network $NETWORK \
              -p 6379:6379 \
              --restart unless-stopped \
              redis:7-alpine

            docker pull ${{ secrets.DOCKER_USERNAME }}/castle-coder-be:latest

            docker run -d \
              --name castle-coder-be \
              --network $NETWORK \
              -p 8080:8080 \
              -v $HOME/.env:/app/.env \
              -w /app \
              ${{ secrets.DOCKER_USERNAME }}/castle-coder-be:latest







