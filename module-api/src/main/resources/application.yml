server:
  port: 8080
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true

runpod:
  api:
    key: ${RUNPOD_API_KEY}
    base-url: ${RUNPOD_BASE_URL}
    endpoint: ${RUNPOD_ENDPOINT}

springdoc:
  path: /swagger-ui/index.html
  swagger-ui:
    tags-sorter: default
    operations-sorter: method

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create # none, update, create, create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true


jwt:
  secret: ${JWT_SECRET_KEY} # JWT 서명을 위한 시크릿 키
  access-expiration-seconds: ${ACCESS_EXPIRATION_SECONDS} # access token 만료 시간
  refresh-expiration-seconds: ${REFRESH_EXPIRATION_SECONDS} # refresh token 만료 시간
