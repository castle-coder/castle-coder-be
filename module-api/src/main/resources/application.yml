server:
  port: 8080
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true

runpod:
  api:
    key: ${RUNPOD_API_KEY}
    base-url: ${RUNPOD_BASE_URL}
    endpoint: ${RUNPOD_ENDPOINT}

springdoc:
  path: /swagger-ui/index.html
  swagger-ui:
    tags-sorter: default
    operations-sorter: method

spring:
  data:
    redis:
      host: redis
      port: 6379

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 120000
      max-lifetime: 1800000
      connection-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: update # none, update, create, create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
  servlet:
    multipart:
      max-file-size: 10MB # multipart/form-data 요청의 최대 허용 크기. 기본 1MB
      max-request-size: 10MB # multipart/form-data 요청의 최대 허용 크기. 기본 10MB



jwt:
  secret: ${JWT_SECRET_KEY} # JWT 서명을 위한 시크릿 키
  access-expiration-seconds: ${ACCESS_EXPIRATION_SECONDS} # access token 만료 시간
  refresh-expiration-seconds: ${REFRESH_EXPIRATION_SECONDS} # refresh token 만료 시간

# AWS S3
cloud:
  aws:
    s3:
      bucket: castle-coder-s3-bucket   # 버킷 이름
    region:
      static: ap-northeast-2  # 버킷의 리전
    stack:
      auto: false
    credentials:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}

openai:
  model: gpt-4.1-mini
  api:
    key: ${OPENAI_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution.percentiles-histogram:
      http.server.requests: true      # HTTP p95/p99
      grpc.client.requests: true      # gRPC Stub p95/p99