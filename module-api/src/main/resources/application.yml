server:
  port: 8080
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true

runpod:
  api:
    key: ${RUNPOD_API_KEY}
    base-url: ${RUNPOD_BASE_URL}
    endpoint: ${RUNPOD_ENDPOINT}

springdoc:
  path: /swagger-ui/index.html
  swagger-ui:
    tags-sorter: default
    operations-sorter: method