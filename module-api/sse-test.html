<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>RunPod SSE Streaming</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background-color: #f0f0f0;
        }
        textarea, button {
            font-size: 1rem;
            margin: 0.5rem 0;
            padding: 0.5rem;
            width: 100%;
            box-sizing: border-box;
        }
        #output {
            border: 1px solid #ccc;
            background: white;
            padding: 1rem;
            min-height: 200px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<h2>RunPod SSE Streaming</h2>
<label for="prompt">Prompt:</label>
<textarea id="prompt" rows="5" placeholder="Enter your prompt..."></textarea>
<button id="start">Start Streaming</button>
<h3>Output</h3>
<div id="output">Waiting for stream...</div>

<script>
    document.getElementById('start').addEventListener('click', function() {
        const prompt = document.getElementById('prompt').value.trim();
        const outputDiv = document.getElementById('output');
        if (!prompt) {
            outputDiv.textContent = "⚠️ Please enter a prompt.";
            return;
        }

        outputDiv.textContent = "⏳ Starting stream...\n";

        // GET 방식으로 쿼리 파라미터를 통해 프롬프트 전달
        const url = "http://localhost:8080/api/v1/runpod/stream?prompt=" + encodeURIComponent(prompt);

        fetch(url, { method: "GET" })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to connect to stream endpoint.");
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                function read() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            outputDiv.textContent += "\n✅ Stream complete.";
                            return;
                        }
                        const chunk = decoder.decode(value, { stream: true });
                        // SSE 형식은 "data:"로 시작하는 라인이 있음
                        chunk.split("\n").forEach(line => {
                            if (line.startsWith("data:")) {
                                const data = line.replace("data:", "").trim();
                                outputDiv.textContent += data;
                            }
                        });
                        read();
                    });
                }
                read();
            })
            .catch(err => {
                outputDiv.textContent = "❌ Error: " + err.message;
                console.error(err);
            });
    });
</script>
</body>
</html>
