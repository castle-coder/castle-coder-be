dependencies {
    // ==========================================
    // Spring Boot 기본 의존성
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-web'        // Spring MVC
    implementation 'org.springframework.boot:spring-boot-starter-webflux'    // Reactive Web
    implementation 'org.springframework.boot:spring-boot-starter-validation' // 데이터 검증
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'   // JPA
    implementation 'org.springframework.boot:spring-boot-starter-security'   // Spring Security

    // ==========================================
    // JWT 관련 의존성
    // ==========================================
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'        // JWT API
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'         // JWT 구현체
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'      // JWT Jackson 지원

    // ==========================================
    // API 문서화 의존성
    // ==========================================
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'  // Swagger UI

    // ==========================================
    // 프로젝트 내부 모듈 의존성
    // ==========================================
    implementation project(":module-infra")  // 인프라 모듈
    implementation project(":module-core")   // 코어 모듈
    implementation project(":module-common") // 공통 모듈

    // ==========================================
    // gRPC 관련 의존성
    // ==========================================
    implementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'  // gRPC 클라이언트
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'         // gRPC 서버

    // ==========================================
    // 테스트 관련 의존성
    // ==========================================
    testImplementation 'io.projectreactor:reactor-test'                     // Reactive 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'  // Spring 테스트
    testImplementation 'org.springframework.security:spring-security-test'  // Security 테스트

    // ==========================================
    // 모니터링 관련 의존성
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-grpc-1.27:2.5.0-alpha'
}